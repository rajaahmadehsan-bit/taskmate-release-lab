<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- HOTFIX v1.0.1: add the viewport meta tag on the next line -->
<title>Student Task Manager</title>
<style>
  :root { --bg:#eef2f1; --card:#ffffff; --ink:#1d2b2a; --muted:#5d6f6d; --accent:#0f6b5c; --danger:#b3382c; --line:#d3dedc; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Georgia, "Times New Roman", serif; background:var(--bg); color:var(--ink); }
  main { max-width:560px; margin:40px auto; padding:0 16px; }
  h1 { font-size:28px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; font-family: Arial, sans-serif; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:20px; }
  label { display:block; font-family:Arial,sans-serif; font-size:13px; margin:12px 0 4px; color:var(--muted); }
  input[type=text], input[type=password] { width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; font-size:15px; }
  button { font-family:Arial,sans-serif; cursor:pointer; border:0; border-radius:6px; background:var(--accent); color:#fff; }
  /* v1.0.0 login buttons are small (this is the mobile bug fixed in v1.0.1) */
  .auth-btn { padding:3px 6px; font-size:10px; margin:14px 8px 0 0; }
  .alt { background:#fff; color:var(--accent); border:1px solid var(--accent); }
  #msg { font-family:Arial,sans-serif; font-size:13px; min-height:18px; margin-top:12px; }
  .err { color:var(--danger); } .ok { color:var(--accent); }
  .row { display:flex; gap:8px; margin-bottom:16px; }
  .row input { flex:1; }
  .row button { padding:10px 16px; font-size:14px; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  li span { flex:1; } li.done span { text-decoration:line-through; color:var(--muted); }
  li button { padding:6px 10px; font-size:12px; }
  .del { background:var(--danger); }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-family:Arial,sans-serif; font-size:14px; }
  .top button { padding:6px 12px; background:#fff; color:var(--ink); border:1px solid var(--line); }
  .empty { color:var(--muted); font-family:Arial,sans-serif; font-size:14px; padding:10px 0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Student Task Manager</h1>
  <p class="sub">Version 1.0.0 &mdash; keep track of your coursework.</p>

  <section id="auth" class="card">
    <label for="user">Username</label>
    <input type="text" id="user" autocomplete="username">
    <label for="pass">Password</label>
    <input type="password" id="pass" autocomplete="current-password">
    <button id="loginBtn" class="auth-btn">Log in</button>
    <button id="signupBtn" class="auth-btn alt">Sign up</button>
    <div id="msg"></div>
  </section>

  <section id="app" class="card" hidden>
    <div class="top"><span id="hello"></span><button id="logoutBtn">Log out</button></div>
    <div class="row">
      <input type="text" id="taskInput" placeholder="New task, e.g. Finish Lab 10">
      <button id="addBtn">Add task</button>
    </div>
    <div id="taskMsg" class="err" style="font-family:Arial,sans-serif;font-size:13px;min-height:18px;margin-bottom:8px"></div>
    <ul id="list"></ul>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);
  const getUsers = () => JSON.parse(localStorage.getItem("stm_users") || "{}");
  const getTasks = u => JSON.parse(localStorage.getItem("stm_tasks_" + u) || "[]");
  const saveTasks = (u, t) => localStorage.setItem("stm_tasks_" + u, JSON.stringify(t));
  let current = null;

  function say(text, ok) { $("msg").textContent = text; $("msg").className = ok ? "ok" : "err"; }

  $("signupBtn").onclick = () => {
    const u = $("user").value.trim(), p = $("pass").value;
    if (!u || !p) return say("Enter a username and a password.");
    const users = getUsers();
    if (users[u]) return say("That username is already taken.");
    users[u] = p; localStorage.setItem("stm_users", JSON.stringify(users));
    say("Account created. You can log in now.", true);
  };

  $("loginBtn").onclick = () => {
    const u = $("user").value.trim(), p = $("pass").value;
    if (!u || !p) return say("Enter a username and a password.");
    const users = getUsers();
    if (users[u] !== p) return say("Wrong username or password.");
    current = u; $("auth").hidden = true; $("app").hidden = false;
    $("hello").textContent = "Signed in as " + u; $("pass").value = ""; say("");
    render();
  };

  $("logoutBtn").onclick = () => { current = null; $("app").hidden = true; $("auth").hidden = false; };

  $("addBtn").onclick = () => {
    const title = $("taskInput").value.trim();
    if (!title) { $("taskMsg").textContent = "Task title cannot be empty."; return; }
    $("taskMsg").textContent = "";
    const t = getTasks(current); t.push({ id: Date.now(), title, done: false });
    saveTasks(current, t); $("taskInput").value = ""; render();
  };

  function render() {
    const t = getTasks(current), ul = $("list"); ul.innerHTML = "";
    if (!t.length) { ul.innerHTML = '<div class="empty">No tasks yet. Add your first one above.</div>'; return; }
    t.forEach(task => {
      const li = document.createElement("li"); if (task.done) li.className = "done";
      const s = document.createElement("span"); s.textContent = task.title;
      const c = document.createElement("button"); c.textContent = task.done ? "Undo" : "Complete";
      c.onclick = () => { task.done = !task.done; saveTasks(current, t); render(); };
      const d = document.createElement("button"); d.textContent = "Delete"; d.className = "del";
      d.onclick = () => { saveTasks(current, t.filter(x => x.id !== task.id)); render(); };
      li.append(s, c, d); ul.appendChild(li);
    });
  }
</script>
</body>
</html>
